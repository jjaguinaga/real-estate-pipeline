version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: real_estate
      POSTGRES_USER: naga
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U naga -d real_estate"]
      interval: 5s
      timeout: 5s
      retries: 5

  pipeline:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_NAME: real_estate
      DB_USER: naga
      DB_PASSWORD: password
      DB_PORT: 5432
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs

volumes:
  postgres_data: